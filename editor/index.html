    <strellis-editor slot="editor" selected="true" language="javascript" filename="strudel.js" default-value="Pattern.prototype.emit = function (eventName) {

    <strellis-editor slot="editor"  language="javascript" filename="sketch.js" default-value="// Listen for messages from the Strudel instance 
let strudelBData = {};
let strudelMData = {};
let strudelData = {};
let strudelPData = {};

let colorPairs;

window.addEventListener(&quot;message&quot;, (event) =&gt; {
   if (event.data.type === &quot;STRUDEL_EVENT&quot;) {
      if (event.data.eventName === &#39;B&#39;) {
         strudelBData = event.data.value;
      } else if (event.data.eventName === &#39;M&#39;) {
         strudelMData = event.data.value;
      } else if (event.data.eventName === &#39;P&#39;) {
         strudelPData = event.data.value;
      }
   }
});

const ts = Date.now(); // e.g. 1744393200000

function tsToSeed(ts) {
   let h = ts ^ (ts &gt;&gt;&gt; 16);        // XOR with right-shifted self
   h = Math.imul(h, 0x45d9f3b);    // multiply by a mixing constant
   h = h ^ (h &gt;&gt;&gt; 16);             // XOR again
   return (h &gt;&gt;&gt; 0);               // force to unsigned 32-bit integer
}

function mulberry32(seed) {
   let s = seed &gt;&gt;&gt; 0;
   return () =&gt; {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      let t = Math.imul(s ^ s &gt;&gt;&gt; 15, 1 | s);
      t = t + Math.imul(t ^ t &gt;&gt;&gt; 7, 61 | t) ^ t;
      return ((t ^ t &gt;&gt;&gt; 14) &gt;&gt;&gt; 0) / 4294967296; // returns 0.0–1.0
   };
}

const rng = mulberry32(tsToSeed(Date.now()));

function setup() {
   createCanvas(windowWidth, windowHeight);
   frameRate(20);
   noiseSeed(rng());
   randomSeed(rng());
   angleMode(DEGREES);
}

function draw() {
   if (!strudelBData.s) {
      return
   }

   if (random(1) &gt; 0.5) {
      background(255);
   }

   const bChars = strudelBData.s.split(&#39;&#39;);
   const bNoise = noise(getInt(bChars[0]), getInt(bChars[1]), strudelBData.cutoff);
   const mNoise = noise(strudelMData.duration, strudelMData.gain, strudelMData.room);


   const bv = map(bNoise, 0, 1, -100, 100);
   const mv = map(mNoise, 0, 1, -100, 100);

   const gridSize = 50;
   const cols = width / gridSize;
   const rows = height / gridSize;



   for (let i = 0; i &lt; cols; i++) {
      for (let j = 0; j &lt; rows; j++) {
         const x = i * gridSize;
         const y = j * gridSize;

         push();
         rectMode(CENTER);
         translate(x, y);
         rect(0, 0, gridSize * map(bNoise, 0, 1, 0.4, 2), gridSize * map(bNoise, 0, 1, 0.4, 2));
         pop();

      }
   }
}

function getInt(str) {
   return str.charCodeAt(0);
}"></strellis-editor>
