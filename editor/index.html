<body>
  <strellis-provider>
    <strellis-controls slot="controls"></strellis-controls>
    <strellis-sidebar slot="sidebar"></strellis-sidebar>
    <strellis-display-panel slot="display-panel">
      <iframe slot="display" frameborder="0" allow="midi; accelerometer; gyroscope; magnetometer"
        sandbox="allow-scripts allow-modals allow-pointer-lock">
      </iframe>
    </strellis-display-panel>

    
    <strellis-editor slot="editor"  language="html" filename="index.html" default-value="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
    &lt;meta charset=&quot;UTF-8&quot;&gt;
    &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
    &lt;title&gt;Strellis Editor&lt;/title&gt;
    &lt;link rel=&quot;stylesheet&quot; href=&quot;styles.css&quot;&gt;
    &lt;script src=&quot;https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js&quot; crossorigin=&quot;&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;sketch.js&quot;&gt;&lt;/script&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;/body&gt;
&lt;/html&gt;
"></strellis-editor>
    
    <strellis-editor slot="editor"  language="css" filename="styles.css" default-value="/* http://meyerweb.com/eric/tools/css/reset/

*/

h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,

b, u, i, center,

"></strellis-editor>
    
    <strellis-editor slot="editor" selected="true" language="javascript" filename="strudel.js" default-value="// Send to iframe context
const sendToIframe = (event) =&gt; {
  window.dispatchEvent(new CustomEvent(&#39;STRUDEL_EVENT&#39;, {detail: event})); // Dispatch custom event in current window
};

// Use it in your pattern chain
note(&quot;C3 E3 G3&quot;).s(&quot;sine&quot;)
  .fmap((event) =&gt; {
    sendToIframe(event); // Send message as side effect
    return event; // Return event unchanged for audio to continue
  })
"></strellis-editor>
    
    <strellis-editor slot="editor"  language="javascript" filename="sketch.js" default-value="// Listen for messages from the Strudel instance 
let strudelData = {};
let colorPairs;

const COLUMNS_COUNT = 8

window.addEventListener(&quot;message&quot;, (event) =&gt; {
   if (event.data.type === &quot;STRUDEL_EVENT&quot;) {
      strudelData = event.data.val; // Store the received data for use in the sketch
   }
});

function setup() {
   createCanvas(windowWidth, windowHeight);

   colorPairs = [
      [color(&#39;#FC427B&#39;), color(&#39;#9AECDB&#39;)],
      [color(&#39;#D6A2E8&#39;), color(&#39;#F8EFBA&#39;)],
      [color(&#39;#55E6C1&#39;), color(&#39;#F97F51&#39;)],
      [color(&#39;#1B9CFC&#39;), color(&#39;#CAD3C8&#39;)],
      [color(&#39;#9AECDB&#39;), color(&#39;#EAB543&#39;)],
      [color(&#39;#BDC581&#39;), color(&#39;#2C3A47&#39;)],
      [color(&#39;#3B3B98&#39;), color(&#39;#6D214F&#39;)],
      [color(&#39;#F8EFBA&#39;), color(&#39;#FEA47F&#39;)],
   ]
}

function draw() {
   const n = map(getNoiseValueFromNote(strudelData.note), 0, 1, 0, random(200));

   const colorTransition = map(sin(frameCount * 0.05), -1, 1, 0, 1);
   const xTransition = map(sin((frameCount * 0.5)), -1, 1, 0, 1);

   let colorIndex = 0;

   for (let x = 0; x &lt; width; x += width / COLUMNS_COUNT) {
      const palette = colorPairs[colorIndex];
      const rectFill = lerpColor(palette[0], palette[1], colorTransition);
      push();
      noStroke();
      rectFill.setAlpha(n);
      fill(rectFill);
      let baseX = x;
      const endX = x + 200;
      const xVal = lerp(baseX, endX, xTransition);

      translate(xVal, 0)

      rect(0, 0, width / COLUMNS_COUNT, height);
      pop();

      colorIndex++;
   }
}

/**
* This helper function takes a note and converts it to a noise value.
* If the note is a number, it simply returns the noise value with that number.
* If the note is a string (like &quot;C4&quot;), it splits the note into its name and octave, converts the name to a numerical value, and then returns the noise value based on those parameters.
*/
function getNoiseValueFromNote(note) {
   if (typeof note === &#39;number&#39;) {
      return noise(note)
   }


   // Split the note at the number 
   const noteParts = note.match(/([a-gA-G#b]+)(&#92;d+)/);

   const name = noteParts[1];
   const octave = noteParts[2];

   const nameValues = name.split(&#39;&#39;).map(letter =&gt; {
      const letterPos = letter.charCodeAt(0) - 64;
      return letterPos
   }
   );

   if (!nameValues) {
      return noise(random(100), octave);
   }

   if (nameValues.length &gt; 1) {
      return noise(nameValues[0], nameValues[1], octave);
   } else {
      return noise(nameValues[0], octave);
   }
}


"></strellis-editor>
    

    <strellis-console slot="console"></strellis-console>
  </strellis-provider>
